services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commai_backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./comm_platform.db
      - SECRET_KEY=72210fafca4045a19f2a95b15deb9108comm-ai-secret-key-super-secure
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: commai_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://localhost:8001

volumes:
  db-data:

